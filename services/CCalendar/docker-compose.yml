services:
    api:
        build: backend
        container_name: cc-calendar-backend
        restart: unless-stopped
        volumes:
            - './backend/www:/var/www'
            - './backend/db:/var/db'
        environment:
            - 'CRYPT_SECRET=76be2f759bdc9fe21eac040a5556e7cbff1d1d6c1cba888575d1b5f98c4d1d77'

    frontend:
        build: frontend
        container_name: cc-calendar-frontend
        restart: unless-stopped
        volumes:
            - './frontend/db:/app/db'
        ports:
            - '8443:443'
        environment:
            - 'CRYPT_SECRET=76be2f759bdc9fe21eac040a5556e7cbff1d1d6c1cba888575d1b5f98c4d1d77'
